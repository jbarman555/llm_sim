[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sim-paper-replication"
version = "0.1.0"
description = "Paper-faithful replication code for LLM_sim noisy knowledge graph refinement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "datasets>=2.18",
  "sentence-transformers>=2.6",
  "transformers>=4.43",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.scripts]
llm-sim-replicate = "llm_sim_replication.cli:main"
llm-sim-dbp-data = "llm_sim_replication.dbp_data:main"

[tool.setuptools.packages.find]
where = ["src"]
